# Infraestructura del sistema bancario (Postgres + API + Frontend).
# - PostgreSQL en el puerto 5433.
# - API en 8081, Frontend en 8082 (el gym usa 80/443).
# - El frontend sirve /api/v1 de forma same-origin (proxy nginx al backend).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: banco
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco
    ports:
      - "5433:5432"
    volumes:
      - banco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banco
      SPRING_DATASOURCE_USERNAME: banco
      SPRING_DATASOURCE_PASSWORD: banco
      # Importante en deploy: setear un JWT_SECRET fuerte en el entorno.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-clave-hs256-de-32-bytes-minimo}
    ports:
      - "8081:8080"

  front:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8082:80"

volumes:
  banco_pgdata:
